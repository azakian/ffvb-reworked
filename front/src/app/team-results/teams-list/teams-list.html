<div class="screen-container">
  @if (teamsResource.isLoading()) {
    <div class="skeleton-layout">
      <div class="skeleton-header">
        <app-skeleton width="80px" [height]="11" [radius]="4" />
        <div style="margin-top: 8px"><app-skeleton width="160px" [height]="28" [radius]="6" /></div>
      </div>
      <div style="padding: 16px 24px 0"><app-skeleton [height]="42" [radius]="12" /></div>
      <div style="padding: 28px 24px 12px">
        <app-skeleton width="120px" [height]="11" [radius]="4" />
      </div>
      <div class="skeleton-cards">
        @for (i of [1, 2, 3, 4]; track i) {
          <div class="skeleton-card">
            <div class="row">
              <app-skeleton width="110px" [height]="16" [radius]="5" />
              <app-skeleton width="60px" [height]="20" [radius]="20" />
            </div>
            <div class="row items">
              <app-skeleton width="40px" [height]="28" [radius]="4" />
              <app-skeleton width="1px" [height]="28" />
              <app-skeleton width="80px" [height]="28" [radius]="4" />
            </div>
          </div>
        }
      </div>
    </div>
  } @else if (teamsPresentation(); as presentation) {
    <div class="section-label">
      <span>Équipes · {{ presentation.teamDescriptions.length }}</span>
    </div>

    <div class="team-list">
      @for (team of presentation.teamDescriptions; track team.teamShortName) {
        <button
          (click)="selectedTeam.set(team.teamShortName)"
          class="team-card"
          [class.highlight]="this.selectedTeam() === team.teamShortName"
        >
          <div class="card-content">
            <div class="info flex-1">
              <div class="header-row">
                <span class="team-name">{{ team.teamName }}</span>
                <span class="poule-badge">{{ team.currentPool.poolName }}</span>
              </div>
              <div class="stats-row">
                <span class="rank">#{{ team.currentRanking }}</span>
                <div class="divider"></div>
                <div>
                  <div class="pts">{{ team.currentPoints }} pts</div>
                  <div class="record">
                    <span class="win">{{ team.currentWon }}V</span> –
                    <span class="loss">{{ team.currentLost }}D</span>
                  </div>
                </div>
              </div>
            </div>
            <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path
                d="M6 4l4 4-4 4"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
        </button>
      }
    </div>
  }
</div>
